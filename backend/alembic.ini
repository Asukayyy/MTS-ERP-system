# Alembic configuration
#
# Usage (run from the backend/ directory):
#   alembic revision --autogenerate -m "description"
#   alembic upgrade head
#
# NOTE: this file is read with the system locale encoding, so keep it ASCII-only.
# The database URL is NOT stored here (to avoid committing passwords).
# migrations/env.py reads it from app.core.config.settings at runtime.

[alembic]
script_location = migrations
prepend_sys_path = .
version_path_separator = os
# sqlalchemy.url is injected by migrations/env.py at runtime

[post_write_hooks]

[loggers]
keys = root,sqlalchemy,alembic

[handlers]
keys = console

[formatters]
keys = generic

[logger_root]
level = WARNING
handlers = console
qualname =

[logger_sqlalchemy]
level = WARNING
handlers =
qualname = sqlalchemy.engine

[logger_alembic]
level = INFO
handlers =
qualname = alembic

[handler_console]
class = StreamHandler
args = (sys.stderr,)
level = NOTSET
formatter = generic

[formatter_generic]
format = %(levelname)-5.5s [%(name)s] %(message)s
datefmt = %H:%M:%S
